name: Intel Mac build

# Unsigned macOS x64 package of this branch, uploaded as a workflow artifact.
# Never notarizes, never publishes a release.
on:
  push:
    branches: [claude-code-keep-alive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package (mac-x64, unsigned)
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      # build/icon.icon needs actool from Xcode 26 on macOS 26, so Intel runners use the full-res icns.
      # Updates point at this repository's releases, so the upstream arm64 feed never replaces this build.
      - name: Target x64, the icns icon, no notarization, and this repository's update feed
        run: |
          sed -i '' \
            -e 's/^        - arm64$/        - x64/' \
            -e 's#^  icon: build/icon.icon$#  icon: build/icon.icns#' \
            -e 's/^  notarize: true$/  notarize: false/' \
            -e "s/^    owner: amosblomqvist$/    owner: ${GITHUB_REPOSITORY_OWNER}/" \
            electron-builder.yml
          [[ $(grep -c '^        - x64$' electron-builder.yml) -ge 2 ]]
          grep -q '^  icon: build/icon.icns$' electron-builder.yml
          grep -q '^  notarize: false$' electron-builder.yml
          grep -q "^    owner: ${GITHUB_REPOSITORY_OWNER}$" electron-builder.yml
      - name: Unsigned macOS x64 package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --publish never
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          app="$(ls -d dist/mac*/LearnHarness.app)/Contents"
          node scripts/smoke-provider-runtime.mjs --standalone "$app/Resources/server/standalone"
          node scripts/smoke-provider-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness"
      - uses: actions/upload-artifact@v7
        with:
          name: learnharness-mac-x64
          retention-days: 14
          if-no-files-found: error
          path: dist/*.dmg
